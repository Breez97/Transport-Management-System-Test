services:
  postgres:
    image: postgres:18
    container_name: tms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  backend-1:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
    container_name: tms-backend-1
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: "-Xms256m -Xmx768m"
      INSTANCE_NAME: backend-1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  backend-2:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
    container_name: tms-backend-2
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: "-Xms256m -Xmx768m"
      INSTANCE_NAME: backend-2
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  load-balancer:
    image: nginx:1.27-alpine
    container_name: tms-load-balancer
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    networks:
      - tms-network


  frontend:
    build:
      context: ./tms-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api/v1
    container_name: tms-frontend
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./certs/localhost.key:/etc/nginx/certs/localhost.key:ro
    depends_on:
      - load-balancer
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    networks:
      - tms-network

volumes:
  postgres-data:

networks:
  tms-network:
    driver: bridge