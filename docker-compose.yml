services:
  postgres:
    image: postgres:18
    container_name: tms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  backend-1:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
    container_name: tms-backend-1
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: "-Xms256m -Xmx768m"
      INSTANCE_NAME: backend-1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  backend-2:
    build:
      context: ./tms-backend
      dockerfile: Dockerfile
    container_name: tms-backend-2
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JAVA_OPTS: "-Xms256m -Xmx768m"
      INSTANCE_NAME: backend-2
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1024m
    memswap_limit: 1024m
    restart: unless-stopped
    networks:
      - tms-network

  load-balancer:
    image: nginx:1.27-alpine
    container_name: tms-load-balancer
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend-1
      - backend-2
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    networks:
      - tms-network

  frontend:
    build:
      context: ./tms-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api/v1
    container_name: tms-frontend
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./certs/localhost.key:/etc/nginx/certs/localhost.key:ro
    depends_on:
      - load-balancer
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    networks:
      - tms-network
  
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: tms-cadvisor
    privileged: true
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    networks:
      - tms-network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: tms-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    networks:
      - tms-network

  grafana:
    image: grafana/grafana:12.3.2
    container_name: tms-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    networks:
      - tms-network

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  tms-network:
    driver: bridge