plugins {
    id 'java'
    id 'application'
}

group = "com.breez"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.knowm.xchart:xchart:4.0.4"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

application {
    mainClass.set("com.breez.optimizer.Main")
}