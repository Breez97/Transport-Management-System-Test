services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: tmsdb
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tmsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: