server:
  port: 8080

spring:
  application:
    name: tms-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tmsdb}
    username: ${DB_USERNAME:tms}
    password: ${DB_PASSWORD:tmspass}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: noreply@tms.com
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: placeholder
            client-secret: placeholder
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

          microsoft:
            client-id: placeholder
            client-secret: placeholder
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
            client-name: Microsoft
            authorization-grant-type: authorization_code
            provider: microsoft

        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    secret: Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi10by1hLXNlY3VyZS1yYW5kb20ta2V5LWF0LWxlYXN0LTI1Ni1iaXRz
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  email:
    enabled: false

  oauth2:
    frontend-redirect-url: http://localhost:3000/oauth2/callback

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.tms: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"